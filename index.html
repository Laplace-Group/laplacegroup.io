<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laplace Group</title>
    <meta name="description" content="Laplace Group.">
    <link rel="canonical" href="https://laplacegroup.io/">
    <link rel="stylesheet" href="/styles.css">
    <meta property="og:title" content="Laplace Group">
    <meta property="og:description" content="Laplace Group">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://laplacegroup.io/">
    <meta property="og:site_name" content="Laplace Group">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Laplace Group">
    <meta name="twitter:description" content="Laplace Group">
  </head>
  <body class="landing-page" data-mode="unicorn">
    <div class="site-shell">
      <div class="technical-grid" aria-hidden="true"></div>
      <div class="grid-fade" aria-hidden="true"></div>

      <header class="site-header">
        <nav class="header-actions" aria-label="Primary navigation">
          <button class="outline-action mode-toggle" type="button" data-ntd-toggle aria-pressed="false">
            <span class="ntd-label">
              NT-D<span class="ntd-state" aria-hidden="true"><span class="ntd-separator">&nbsp;·&nbsp;</span><span class="ntd-decrypt" data-decrypt="Engaged">Engaged</span></span>
            </span>
          </button>
        </nav>
      </header>

      <main class="landing-main">
        <section class="hero-copy" aria-labelledby="hero-title">
          <h1 id="hero-title">Laplace Group</h1>

          <a class="primary-action" href="mailto:hello@laplacegroup.io">Contact</a>
        </section>

        <section class="orrery" aria-label="Laplace orbital diagram">
          <div class="orbit orbit-outer" aria-hidden="true"><span></span></div>
          <div class="orbit orbit-middle" aria-hidden="true"><span></span></div>
          <div class="orbit orbit-inner" aria-hidden="true"><span></span></div>

          <button class="logo-core" type="button" data-ntd-toggle aria-label="Toggle NT-D display mode" aria-pressed="false">
            <span class="triangle-mark" aria-hidden="true"></span>
          </button>

          <span class="annotation annotation-top">Mécanique céleste · 1799</span>
          <span class="annotation annotation-equation">∇²V = 0</span>
          <span class="annotation annotation-side">RX-0 · UC 0096</span>
        </section>
      </main>

      <footer class="site-footer">
        <span>
          © 2026 Laplace Group. All rights reserved. ·
          <a href="/privacy.html">Privacy policy</a>
        </span>
        <span class="footer-code">AD 1814 — UC 0096</span>
      </footer>
    </div>

    <script>
      (() => {
        const toggles = document.querySelectorAll('[data-ntd-toggle]');
        const engagedWord = document.querySelector('.ntd-decrypt');
        const finalText = engagedWord.dataset.decrypt;
        const glyphs = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ零壱弐参伍陸漆捌玖界無電脳0123456789∆∇Ξλψ';
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let decryptFrame = 0;
        let decryptRun = 0;
        let modeTransitioning = false;

        const randomGlyph = () => glyphs[Math.floor(Math.random() * glyphs.length)];

        const buildEngagedWord = (resolved = false) => {
          const fragment = document.createDocumentFragment();
          const characters = [];

          [...finalText].forEach((character) => {
            const characterElement = document.createElement('span');
            characterElement.className = 'ntd-decrypt-char';
            characterElement.dataset.character = character;
            characterElement.dataset.resolved = String(resolved);
            characterElement.textContent = resolved ? character : randomGlyph();
            fragment.append(characterElement);
            characters.push(characterElement);
          });

          engagedWord.replaceChildren(fragment);
          return characters;
        };

        const decryptEngaged = (onComplete) => {
          cancelAnimationFrame(decryptFrame);
          decryptRun += 1;
          const run = decryptRun;

          if (reducedMotion.matches) {
            engagedWord.textContent = finalText;
            onComplete();
            return;
          }

          const characters = buildEngagedWord();
          const startTime = performance.now();
          const stagger = 49;
          const scrambleTime = 269;
          const tickRate = 26;
          let previousTick = 0;

          const animate = (now) => {
            if (run !== decryptRun) return;
            const finishTime = startTime + (characters.length - 1) * stagger + scrambleTime;

            if (now >= finishTime) {
              characters.forEach((character) => {
                character.textContent = character.dataset.character;
                character.dataset.resolved = 'true';
              });
              onComplete();
              return;
            }

            if (now - previousTick >= tickRate) {
              characters.forEach((character, index) => {
                const localTime = now - startTime - index * stagger;

                if (localTime < 0) {
                  character.textContent = '';
                  return;
                }

                if (localTime < scrambleTime) {
                  character.textContent = randomGlyph();
                  character.dataset.resolved = 'false';
                  return;
                }

                character.textContent = character.dataset.character;
                character.dataset.resolved = 'true';
              });
              previousTick = now;
            }

            decryptFrame = requestAnimationFrame(animate);
          };

          decryptFrame = requestAnimationFrame(animate);
        };

        const encryptEngaged = (onComplete) => {
          cancelAnimationFrame(decryptFrame);
          decryptRun += 1;
          const run = decryptRun;

          if (reducedMotion.matches) {
            engagedWord.textContent = '';
            onComplete();
            return;
          }

          const characters = buildEngagedWord(true);
          const startTime = performance.now();
          const stagger = 49;
          const scrambleTime = 269;
          const tickRate = 26;
          let previousTick = 0;

          const animate = (now) => {
            if (run !== decryptRun) return;
            const finishTime = startTime + (characters.length - 1) * stagger + scrambleTime;

            if (now >= finishTime) {
              characters.forEach((character) => {
                character.textContent = '';
                character.dataset.resolved = 'false';
              });
              onComplete();
              return;
            }

            if (now - previousTick >= tickRate) {
              characters.forEach((character, index) => {
                const reverseIndex = characters.length - 1 - index;
                const localTime = now - startTime - reverseIndex * stagger;

                if (localTime < 0) {
                  character.textContent = character.dataset.character;
                  character.dataset.resolved = 'true';
                  return;
                }

                if (localTime < scrambleTime) {
                  character.textContent = randomGlyph();
                  character.dataset.resolved = 'false';
                  return;
                }

                character.textContent = '';
                character.dataset.resolved = 'false';
              });
              previousTick = now;
            }

            decryptFrame = requestAnimationFrame(animate);
          };

          decryptFrame = requestAnimationFrame(animate);
        };

        const setPressed = (pressed) => {
          toggles.forEach((toggle) => toggle.setAttribute('aria-pressed', String(pressed)));
        };

        const setMode = (engaged) => {
          if (modeTransitioning) return;
          modeTransitioning = true;

          if (engaged) {
            document.body.dataset.mode = 'ntd';
            setPressed(true);
            decryptEngaged(() => {
              modeTransitioning = false;
            });
          } else {
            encryptEngaged(() => {
              document.body.dataset.mode = 'unicorn';
              setPressed(false);
              engagedWord.textContent = finalText;
              modeTransitioning = false;
            });
          }
        };

        toggles.forEach((toggle) => {
          toggle.addEventListener('click', () => {
            setMode(document.body.dataset.mode !== 'ntd');
          });
        });

      })();
    </script>
  </body>
</html>
